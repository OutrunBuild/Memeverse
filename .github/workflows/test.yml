name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Gate CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Slither
        run: python3 -m pip install slither-analyzer==0.11.5 jsonschema

      - name: Show Forge version
        run: forge --version

      - name: Run gate:ci
        env:
          HARNESS_EVENT_NAME: ${{ github.event_name }}
          RUN_RECORD_PATH: ${{ runner.temp }}/memeversev2-gate-ci.json
        run: bash script/harness/ci-gate-entrypoint.sh

      - name: Upload gate run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-ci-run-record
          path: ${{ runner.temp }}/memeversev2-gate-ci.json
          if-no-files-found: error
