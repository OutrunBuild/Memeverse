[profile.default]
src = "src"
out = "out"
test = 'test'
cache_path = 'cache'
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
evm_version = "prague"
dynamic_test_linking = false
eth_rpc_timeout = 120
extra_output = ["storageLayout"]
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./src"}, { access = "read", path = "./script"}, { access = "read", path = "./test"}, { access = "read", path = "./docs"}]

# 3860 (initcode size) / 5574 (contract code size): all current hits are test/script
# contracts, never deployed on-chain; audit on demand with `forge build --sizes`.
# 4591 is solc's ">256 warnings suppressed" cap notice; the underlying warnings are
# lib/ dependency noise already filtered below and the notice carries no signal.
ignored_error_codes = [6335, 2424, 2018, 8429, 2394, 3860, 5574, 4591]

[rpc_endpoints]
sepolia = "${ETHEREUM_SEPOLIA_RPC}"
bsc_testnet = "${BSC_TESTNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

eth_mainnet = "${ETHEREUM_MAINNET_RPC}"
bsc_mainnet = "${BSC_MAINNET_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"

[etherscan]
bsc_testnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "97", url = "${ETHEREUMSCAN_API_URL}" }
base_sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "84532", url = "${ETHEREUMSCAN_API_URL}" }
sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "11155111", url = "${ETHEREUMSCAN_API_URL}" }

eth_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "1", url = "${ETHEREUMSCAN_API_URL}" }
bsc_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "56", url = "${ETHEREUMSCAN_API_URL}" }
base_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "8453", url = "${ETHEREUMSCAN_API_URL}" }

[lint]
ignore = ["test/**/*", "script/**/*"]
severity = ["high", "med", "low"]
# All detectors are active; accepted findings live in .harness/forge-lint-baseline.json.
# Only NEW findings fail: script/harness/forge-serialize.sh checks the baseline after every
# wrapped build/compile, and the gate checks on changed-file runs. An unwrapped direct
# `forge build` prints the full lint report (default config) — use the wrapper.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
