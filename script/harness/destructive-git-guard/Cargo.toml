[package]
name = "destructive-git-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
agent-shell-parser = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
